# Local stack: API plus the Streamlit UI, sharing one vector store volume.
# Usage: cp .env.example .env, add your key, then `docker compose up --build`.

services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      LANCE_DB_PATH: /app/data/vector_db
      IMAGES_PATH: /app/data/images
      LOG_FILE: /app/logs/app.log
      CORS_ORIGINS: http://localhost:8501
    volumes:
      - docubot-data:/app/data
      - docubot-logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  ui:
    build: .
    command: >
      streamlit run streamlit_app.py
      --server.port 8501 --server.address 0.0.0.0 --server.headless true
    ports:
      - "8501:8501"
    env_file: .env
    environment:
      LANCE_DB_PATH: /app/data/vector_db
      IMAGES_PATH: /app/data/images
      LOG_FILE: /app/logs/ui.log
    volumes:
      # Same volume as the API: both processes read one index. This is also the
      # reason the stack does not scale past one replica of each -- see README.
      - docubot-data:/app/data
      - docubot-logs:/app/logs
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  docubot-data:
  docubot-logs:
