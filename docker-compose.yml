# DocuBot AI — Docker Compose para desarrollo local
# Uso: docker-compose up --build

services:
  docubot-api:
    build: .
    container_name: docubot-ai
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - LANCE_DB_PATH=/app/data/vector_db
      - IMAGES_PATH=/app/data/images
      - LOG_FILE=/app/logs/app.log
    volumes:
      - docubot-data:/app/data
      - docubot-logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r = httpx.get('http://localhost:8000/api/v1/health'); assert r.status_code == 200"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  docubot-data:
    driver: local
  docubot-logs:
    driver: local
