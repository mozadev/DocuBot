name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      # The suite runs offline: no OPENAI_API_KEY, no network. Settings still
      # requires the variable to be present, so a dummy value is enough.
      - name: Test
        env:
          OPENAI_API_KEY: ci-not-used
        run: pytest --cov=. --cov-report=term-missing

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t docubot-ai:ci .
